<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pharm | SRNA Study Tool</title>

<style>
:root {
    --navy:#1a365d;
    --blue:#2b6cb0;
    --bg:#edf2f7;
    --card:#ffffff;
    --text:#2d3748;
    --muted:#718096;
    --border:#cbd5e0;
}

* { box-sizing:border-box; }

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

.container {
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.back {
    display:inline-block;
    color:var(--blue);
    text-decoration:none;
    font-weight:700;
    margin-bottom:18px;
}

header {
    border-bottom:2px solid var(--border);
    padding-bottom:20px;
    margin-bottom:28px;
}

h1 {
    margin:0;
    color:var(--navy);
    font-size:32px;
}

.subtitle {
    color:var(--muted);
    margin-top:6px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.card h2 {
    margin:0 0 8px;
    color:var(--navy);
}

.card p {
    color:var(--muted);
    min-height:48px;
}

.btn {
    display:inline-block;
    background:var(--navy);
    color:white;
    text-decoration:none;
    padding:11px 18px;
    border-radius:7px;
    font-weight:700;
}

.btn:hover {
    background:var(--blue);
}

.disabled {
    opacity:.55;
}

.disabled .btn {
    background:#a0aec0;
    pointer-events:none;
}

@media(max-width:600px) {
    .container { width:100%; padding:18px 14px 24px; }
    header { margin-bottom:20px; padding-bottom:16px; }
    h1 { font-size:clamp(27px,8vw,32px); line-height:1.08; }
    .subtitle { font-size:15px; line-height:1.4; }
    .grid { grid-template-columns:minmax(0,1fr); gap:14px; }
    .card { padding:18px; }
    .card p { min-height:0; margin-bottom:16px; }
    .btn { display:flex; width:100%; min-height:46px; align-items:center; justify-content:center; text-align:center; }
}
</style>
</head>

<body>

<div class="container">



<header>
    <h1>Pharm</h1>
    <div class="subtitle">Exam preparation and question banks</div>
</header>

<div class="grid">
    <div class="card">
        <h2>Clinical Pharm</h2>
        <p>Clinical pharmacology question bank and Study Studio.</p>
        <a class="btn" href="clinical-pharm/">Open Clinical Pharm Dashboard →</a>
    </div>
</div>

</div>

<script>window.MBU_CONTEXT={courseId:'pharm',courseLabel:'Pharm',courseUrl:'./',examUrl:'clinical-pharm/'};</script><script>window.MBU_BOOT={styles:['site-nav.css'],scripts:[{src:'site-nav.js',data:{page:'pharm'}},'auto-update.js']};</script><script src="../equipment/assets/build-bootstrap.js"></script>
</body>
</html>

name: Diagnose isolated staging source review
on:
  push:
    branches: [fix/staging-source-review-diagnostic]
permissions:
  contents: read
concurrency:
  group: staging-isolated-source-review-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'psycopg[binary]'
      - name: Diagnose one source review without creating or changing drafts
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_RECEIPT_SIGNING_SECRET: ${{ secrets.STAGING_RECEIPT_SIGNING_SECRET }}
        run: |
          PYTHONPATH=workers/source-library-staging/scripts python scripts/diagnose-source-review.py

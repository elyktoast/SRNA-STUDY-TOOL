name: Explicit board-quality read-only control
on:
  push:
    branches: [fix/verify-board-quality-controls]
    paths: ['.github/workflows/verify-board-quality-controls.yml']
permissions:
  contents: read
concurrency:
  group: source-reviewer-staging-deployment
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r workers/source-library-staging/reviewer-service/requirements.txt
      - name: Read-only known-defect regression without deployment
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_RECEIPT_SIGNING_SECRET: ${{ secrets.STAGING_RECEIPT_SIGNING_SECRET }}
        run: PYTHONPATH=workers/source-library-staging/scripts python scripts/verify-board-quality-live.py --confirm-paid-review

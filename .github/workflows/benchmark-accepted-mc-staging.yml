name: Benchmark accepted staging MC batches
on:
  push:
    branches: [verify/mc-objective-heading-20261118]
permissions:
  contents: read
  checks: read
concurrency:
  group: accepted-mc-staging-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.run_attempt == '1' && (contains(github.event.head_commit.message, '[mc-benchmark-start]') || contains(github.event.head_commit.message, '[mc-benchmark-check]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: source-library-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm deployed implementation
        if: contains(github.event.head_commit.message, '[mc-benchmark-start]')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: GITHUB_SHA=545465cbd041522bf6eabad1b2110960775bd829 node scripts/wait-staging-reviewer-rollout.mjs
      - name: Measure the current benchmark stage
        env:
          START_MCBENCH: ${{ contains(github.event.head_commit.message, '[mc-benchmark-start]') }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/benchmark-accepted-mc-staging.mjs

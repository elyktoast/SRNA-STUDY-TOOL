name: Phase C focused tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-c-focused-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Staging generation and draft integration
    if: github.ref == 'refs/heads/feature/phase-c-source-library-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused offline tests
        run: bash workers/source-library-staging/scripts/run_phase_c_focused_tests.sh

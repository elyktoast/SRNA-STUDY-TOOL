name: Lecture MC acceptance
on:
  push:
    branches: [verify/mc-objective-heading-20261118]
permissions:
  contents: read
concurrency:
  group: source-reviewer-staging-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: github.run_attempt == '1' && contains(github.event.head_commit.message, '[verify-pns-complete-case]')
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check verification scripts
        run: |
          node --check scripts/verify-mc-quality-set.mjs
          node --check scripts/verify-pns-deployment.mjs
      - name: Verify deployed staging code and container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-pns-deployment.mjs
      - name: Generate one emphasized lecture control
        env:
          CONFIRM_PAID_MC_SET: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/verify-mc-quality-set.mjs
      - name: Retain exact results and blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highlighted-lecture-mc-results
          path: /tmp/srna-mc-quality-results.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Require automated acceptance after retaining results
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const rows=JSON.parse(readFileSync('/tmp/srna-mc-quality-results.json','utf8'));
          assert.equal(rows.length,1,'Expected the single bounded control result');
          for(const row of rows){
            assert.equal(row.accepted,true,'Question remains held; see the retained blockers');
            assert.equal(row.published,false);
            assert.equal(row.passing_checks,10);
            assert.equal(row.current_source_issues?.length,0);
          }
          console.log('All ten automated checks passed; human clinical review is still required.');
          JS
  reviewer-controls:
    if: github.run_attempt == '1' && (contains(github.event.head_commit.message, '[verify-mc-reviewer-controls]') || contains(github.event.head_commit.message, '[verify-mc-clinical-controls]') || contains(github.event.head_commit.message, '[verify-mc-candidate-controls]'))
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: a39a0ed2020600bb6d54d10bbaf0fdeda29b82d4
          path: reviewer-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only source database adapter
        if: contains(github.event.head_commit.message, '[verify-mc-clinical-controls]') || contains(github.event.head_commit.message, '[verify-mc-candidate-controls]')
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - name: Run fixed positive and negative reviewer controls without drafts
        env:
          CONFIRM_PAID_REVIEWER_CONTROLS: 'true'
          REVIEWER_CONTROL_SUITE: ${{ contains(github.event.head_commit.message, '[verify-mc-candidate-controls]') && 'all' || contains(github.event.head_commit.message, '[verify-mc-clinical-controls]') && 'clinical' || 'basic' }}
          REVIEWER_CONTROL_CANDIDATE: ${{ contains(github.event.head_commit.message, '[verify-mc-candidate-controls]') && 'true' || 'false' }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_RECEIPT_SIGNING_SECRET: ${{ secrets.STAGING_RECEIPT_SIGNING_SECRET }}
          REVIEWER_SOURCE_ROOT: ${{ github.workspace }}/reviewer-source
          PYTHONPATH: ${{ github.workspace }}/reviewer-source/workers/source-library-staging/scripts
        run: python scripts/verify-mc-reviewer-controls.py
      - name: Retain reviewer calibration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-reviewer-controls
          path: /tmp/mc-reviewer-controls.json
          if-no-files-found: ignore
          retention-days: 14

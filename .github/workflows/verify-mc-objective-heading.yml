name: MC objective heading acceptance
on:
  push:
    branches: [verify/mc-objective-heading-20261118]
permissions:
  contents: read
concurrency:
  group: source-reviewer-staging-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-mc-heading]')
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact read-only lecture topic then one fresh MC
        env:
          CONFIRM_PAID_MC_SET: 'true'
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/verify-mc-quality-set.mjs
      - name: Retain exact result and blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-objective-heading-result
          path: /tmp/srna-mc-quality-results.json
          retention-days: 14
          if-no-files-found: ignore

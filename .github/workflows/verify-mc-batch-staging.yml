name: Staging MC batch acceptance
on:
  push:
    branches: [verify/mc-objective-heading-20261118]
permissions:
  contents: read
  checks: read
concurrency:
  group: source-reviewer-staging-deployment
  cancel-in-progress: false
jobs:
  batch:
    if: github.run_attempt == '1' && contains(github.event.head_commit.message, '[verify-mc-batch-once]')
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact staging rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-mc-batch-deployment.mjs
      - name: Plan 25 lecture questions and execute one background draft
        env:
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/verify-mc-batch-staging.mjs

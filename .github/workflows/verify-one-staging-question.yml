name: Explicit staging one-question acceptance
on:
  workflow_dispatch:
    inputs:
      backfill_semantic_index:
        description: Populate the private Cloudflare duplicate index; no question generation
        type: boolean
        default: false
      confirm_paid_generation:
        description: Generate and save one unpublished staging question
        type: boolean
        required: true
        default: false
      format:
        description: Question format for one paid sample
        type: choice
        options: [MC, MS, SA, DD, HS]
        default: MC
      topic:
        description: Topic for the one paid sample
        type: string
        default: Local anesthetic pharmacology
      objective:
        description: NCE/SEE objective code
        type: string
        default: I.C.5
      textbook_id:
        description: Primary owned staging textbook UUID
        type: string
        default: 62f162fd-6c12-4899-b45b-6466e688f570
  push:
    branches: [fix/staging-final-acceptance, fix/staging-semantic-index-backfill]
permissions:
  contents: read
  checks: read
concurrency:
  group: source-reviewer-staging-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && ((github.ref == 'refs/heads/fix/staging-final-acceptance' && contains(github.event.head_commit.message, '[verify-one-staging-question]')) || (github.ref == 'refs/heads/fix/staging-semantic-index-backfill' && contains(github.event.head_commit.message, '[backfill-staging-semantic-index]'))))
    env:
      BACKFILL_SEMANTIC_INDEX: ${{ inputs.backfill_semantic_index || (github.event_name == 'push' && github.ref == 'refs/heads/fix/staging-semantic-index-backfill' && contains(github.event.head_commit.message, '[backfill-staging-semantic-index]')) }}
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build disposable lecture extraction fixtures
        if: ${{ env.BACKFILL_SEMANTIC_INDEX != 'true' }}
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'python-pptx>=1.0,<2'
          python - <<'PY'
          import base64, io, json
          from pathlib import Path
          import fitz
          from pptx import Presentation
          topics=['Local anesthetic ionization','Local anesthetic onset','Local anesthetic protein binding']
          pdf=fitz.open()
          page=pdf.new_page()
          page.insert_text((50,70),'\n\n'.join('# '+title for title in topics))
          deck=Presentation()
          for topic in topics:
              slide=deck.slides.add_slide(deck.slide_layouts[1])
              slide.shapes.title.text=topic
              slide.placeholders[1].text='Learning objective: '+topic
          pptx=io.BytesIO()
          deck.save(pptx)
          fixtures=[{'filename':name,'file_base64':base64.b64encode(data).decode()}
                    for name,data in [('acceptance-lecture.pdf',pdf.tobytes()),('acceptance-lecture.pptx',pptx.getvalue())]]
          Path('/tmp/srna-lecture-fixtures.json').write_text(json.dumps(fixtures))
          pdf.close()
          PY
      - name: Require settled existing staging deployment without rebuilding
        if: ${{ env.BACKFILL_SEMANTIC_INDEX != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/wait-staging-reviewer-rollout.mjs
      - name: Verify exactly one indexed question and unpublished persistence
        if: ${{ env.BACKFILL_SEMANTIC_INDEX != 'true' }}
        env:
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SRNA_STAGING_ACCEPTANCE_FORMAT: ${{ inputs.format || 'MC' }}
          SRNA_STAGING_ACCEPTANCE_TOPIC: ${{ inputs.topic || 'Local anesthetic pharmacology' }}
          SRNA_STAGING_ACCEPTANCE_OBJECTIVE: ${{ inputs.objective || 'I.C.5' }}
          SRNA_STAGING_ACCEPTANCE_TEXTBOOK: ${{ inputs.textbook_id || '62f162fd-6c12-4899-b45b-6466e688f570' }}
          SRNA_STAGING_LECTURE_FIXTURES: /tmp/srna-lecture-fixtures.json
          CONFIRM_PAID_GENERATION: ${{ inputs.confirm_paid_generation }}
        run: |
          if [ "$CONFIRM_PAID_GENERATION" = 'true' ]; then
            node scripts/verify-one-staging-question.mjs --confirm-paid-generation
          else
            node scripts/verify-one-staging-question.mjs
          fi
      - name: Populate and reconcile private Cloudflare semantic index
        if: ${{ env.BACKFILL_SEMANTIC_INDEX == 'true' }}
        env:
          STAGING_ONLY: 'true'
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_RECEIPT_SIGNING_SECRET: ${{ secrets.STAGING_RECEIPT_SIGNING_SECRET }}
          SEMANTIC_INDEX_OWNER_UID: c003287a-10ce-4cc9-926e-ef7c3a162a26
          PYTHONPATH: workers/source-library-staging/scripts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
          source_file="$(mktemp /tmp/srna-semantic-source.XXXXXX.json)"
          rm "$source_file"
          trap 'rm -f "$source_file"' EXIT
          node scripts/audit-canonical-semantic-inventory.mjs --export-stems "$source_file"
          python workers/source-library-staging/scripts/backfill_cloudflare_semantic_index_v2.py "$source_file" --apply --max-new 10000

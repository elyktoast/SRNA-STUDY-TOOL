name: AI Source Library tests

on:
  push:
    branches:
      - feat/ai-adaptive-foundation
    paths:
      - 'scripts/ai-source-*.mjs'
      - 'scripts/test-ai-source-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-source-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-source-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Node 22 Source Library regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Source Library JavaScript syntax
        run: |
          for file in scripts/ai-source-*.mjs scripts/test-ai-source-*.mjs; do
            node --check "$file"
          done
      - name: Run Source Library tests and capture failures
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap scripts/test-ai-source-*.mjs > ai-source-test-output.tap 2> ai-source-test-stderr.log
          result=$?
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tap=fs.readFileSync('ai-source-test-output.tap','utf8');
          const lines=tap.split('\n');
          const failures=[];
          for(let i=0;i<lines.length;i++){
            if(!/^not ok \d+ - /.test(lines[i]))continue;
            const section=[lines[i]];
            for(let j=i+1;j<lines.length;j++){
              if(/^(?:ok|not ok) \d+ - /.test(lines[j])||/^1\.\.\d+/.test(lines[j]))break;
              section.push(lines[j]);
            }
            failures.push(section.join('\n').trim());
          }
          const counts=lines.filter(x=>/^# (?:tests|pass|fail|cancelled|skipped) \d+/.test(x));
          const report=['# AI Source Library test failures','',...counts,'','Failed cases: '+failures.length,'',...failures.flatMap((f,i)=>['## Failure '+(i+1),'~~~text',f,'~~~',''])].join('\n');
          fs.writeFileSync('ai-source-failures.md',report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,report.slice(0,50000)+'\n');
          console.log(counts.join('\n'));
          console.log('Failed cases:',failures.length);
          for(const f of failures)console.log(f.split('\n').slice(0,2).join(' '));
          NODE
          exit "$result"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-source-test-failures
          path: |
            ai-source-failures.md
            ai-source-test-output.tap
            ai-source-test-stderr.log
          retention-days: 7

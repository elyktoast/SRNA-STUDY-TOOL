name: Remove redundant SRNA staging branches
on:
  push:
    branches: [verify/mc-objective-heading-20261118]
    paths: ['.github/workflows/clean-integrated-staging-refs.yml']
permissions:
  contents: write
jobs:
  clean:
    if: github.run_attempt == '1' && github.event.head_commit.message == 'Remove 26 redundant SRNA staging branch refs'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only unchanged refs already contained in staging
        shell: bash
        run: |
          set -euo pipefail
          protect=refs/remotes/origin/fix/board-question-quality
          test "$(git rev-parse "$protect")" = f425bcd5c3a56df54f38afe6c8c0454f735cdf57
          leases=()
          deletes=()
          while read -r branch sha; do
            test "$(git rev-parse "refs/remotes/origin/$branch")" = "$sha"
            git merge-base --is-ancestor "$sha" "$protect"
            leases+=("--force-with-lease=refs/heads/$branch:$sha")
            deletes+=(":refs/heads/$branch")
          done <<'TARGETS'
          fix/approval-requires-independent-review 158303df324f1810cff15e0a4143fb23b7946792
          fix/cloudflare-canonical-duplicate-screening adc2ceb6c0ee86ea0993d5c599d450b55cac8daa
          fix/flexible-mc-source-planning a2e0ddbcf68ed253829f4aa9721884deb48abae9
          fix/generated-format-preview 0ba0cfdbc6dc6db06a002760b2b31c5d03de76f3
          fix/generator-acceptance-matrix d6eae5cdfb0eabed82e74ea07f349de5999b29b0
          fix/mc-complete-missing-option-review a84e9937aac9e449bb789be63d20a2fb14624b70
          fix/mc-option-context-query 6cf23747cdf8b339f5beb4ff6729375ad98a93ef
          fix/mc-repair-completion 6de0e063ea8334331179760fa24d57d73ebdcdeb
          fix/mc-shared-question-plan 7b1a60a9821cb91d4d0a2c34d74ec08ca613eec4
          fix/multi-textbook-question-evidence a8ee1e2336d18c2080bec580e26c7bbeb0e7e3e2
          fix/retrieval-back-matter-ranking a3191e4a96911d71565e49f8aec0977195231479
          fix/special-format-source-and-label-validation afe8f5067d2091f7f8c6eba4243f331b915503c5
          fix/staging-draft-list-review-diagnostics 2711a7605eb73b1f5b67f5a6edcbb7c4ac088544
          fix/staging-index-readiness-route fa2f525b87a0fb4783733b5673304ab944557e4d
          fix/staging-mc-lecture-objectives f347edb1c9f18e211b7c9b5fdac9fc488a21a0d3
          fix/staging-mc-objective-evidence-query 120e52fb5b752df438b8e1e06761fe07154057f1
          fix/staging-mc-review-readiness a64d58f4b9a4adbf14620aa1052df5cdde4310f0
          fix/staging-mc-trusted-source-selectors 3eda03e8b78b4286eaeae0fb5781a363ba360b4e
          fix/staging-original-wording-recovery 187eadb0bcca8670e0529c77755602f8c9d550d3
          fix/staging-read-only-acceptance-retries f73e1ff4c5e1ae2bd1196b02c3abc4353a12ee01
          fix/staging-rewrite-semantic-context aadd86846219b75129798e62a5d442062280c679
          fix/staging-rollout-bound-generation 0b84e09afcaf14539a0ab393714138715a88814a
          fix/staging-semantic-backfill-resilience c1ffe358deb49fb5859eb6b1cdde8a0864a89bc8
          fix/staging-semantic-collation 41d49dd6022f0fcf83992ef9a0c7849fb762ba98
          fix/staging-semantic-float-arrays d1accda1b2e96dffe2b368477f8d5a195c61a596
          fix/staging-semantic-padded-context 1a3c8f1b1fb6c20082cbd853cec5050ce64b475d
          TARGETS
          test "${#deletes[@]}" -eq 26
          git push --atomic "${leases[@]}" origin "${deletes[@]}"
          printf 'Removed %s branches whose commits are retained in staging.\n' "${#deletes[@]}"

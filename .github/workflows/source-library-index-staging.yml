name: Source Library staging indexing (manual)
on:
  workflow_dispatch:
    inputs:
      owner_uid:
        description: 'Admin owner UUID for staging textbook records'
        required: true
        default: 'c003287a-10ce-4cc9-926e-ef7c3a162a26'
        type: string
      limit:
        description: 'Maximum staging PDFs to process (1-10)'
        required: true
        default: '1'
        type: string
      r2_key:
        description: 'Optional exact owner-scoped R2 PDF key; blank scans backlog'
        required: false
        default: ''
        type: string
      discover_only:
        description: 'List owner R2 PDF keys and original filenames without extracting or importing'
        required: true
        default: false
        type: boolean
      verify_published_queue:
        description: 'Read back and verify published staging R2 queue and attestation (no writes)'
        required: true
        default: false
        type: boolean
      publish_review_queue:
        description: 'Publish private source-bound review queue to staging R2 only (requires exact r2_key; no page approvals)'
        required: true
        default: false
        type: boolean
      review_queue_dry_run:
        description: 'Check source-bound private page review queue readiness; no R2 or DB writes (requires exact r2_key)'
        required: true
        default: false
        type: boolean
      apply:
        description: 'Write extracted passages to staging Supabase (false = dry run)'
        required: true
        default: false
        type: boolean
      force_reindex:
        description: 'Reindex ready PDFs only when explicitly enabled; use with apply'
        required: true
        default: false
        type: boolean
      ocr:
        description: 'Use Tesseract on image-only or low-text pages'
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: source-library-staging-index
  cancel-in-progress: false
jobs:
  index:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/board-question-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: source-library-staging
    steps:
      - name: Check out exact dispatched staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate operator inputs
        env:
          OWNER_UID: ${{ inputs.owner_uid }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python - <<'PY'
          import os, re
          owner=os.environ['OWNER_UID']
          limit=os.environ['LIMIT']
          if not re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}',owner,re.I):
              raise SystemExit('Invalid owner UUID')
          if not limit.isdecimal() or not 1 <= int(limit) <= 10:
              raise SystemExit('Limit must be 1..10')
          PY
      - name: Install extraction and indexing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'boto3>=1.35,<2' 'psycopg[binary]>=3.2,<4'
      - name: Process owner-scoped staging R2 PDFs
        env:
          R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          OWNER_UID: ${{ inputs.owner_uid }}
          LIMIT: ${{ inputs.limit }}
          R2_KEY: ${{ inputs.r2_key }}
          DISCOVER_ONLY: ${{ inputs.discover_only }}
          REVIEW_QUEUE_DRY_RUN: ${{ inputs.review_queue_dry_run }}
          PUBLISH_REVIEW_QUEUE: ${{ inputs.publish_review_queue }}
          VERIFY_PUBLISHED_QUEUE: ${{ inputs.verify_published_queue }}
          APPLY: ${{ inputs.apply }}
          OCR: ${{ inputs.ocr }}
          FORCE_REINDEX: ${{ inputs.force_reindex }}
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
        run: |
          set -euo pipefail
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" ]]; then
            echo 'Missing staging R2 environment secrets'; exit 1
          fi
          if [[ "$APPLY" == "true" && -z "$DATABASE_URL" ]]; then
            echo "Missing staging database environment secret"; exit 1
          fi
          if [[ "$FORCE_REINDEX" == "true" && "$APPLY" != "true" ]]; then
            echo 'Force reindex requires apply'; exit 1
          fi
          if [[ "$DISCOVER_ONLY" == "true" && ( "$APPLY" == "true" || "$FORCE_REINDEX" == "true" || -n "$R2_KEY" ) ]]; then
            echo "Discovery requires apply=false, force_reindex=false, and blank r2_key"; exit 1
          fi
          if [[ "$VERIFY_PUBLISHED_QUEUE" == "true" ]]; then
            if [[ "$PUBLISH_REVIEW_QUEUE" == "true" || "$REVIEW_QUEUE_DRY_RUN" == "true" || "$APPLY" == "true" || "$DISCOVER_ONLY" == "true" || "$FORCE_REINDEX" == "true" || -z "$R2_KEY" ]]; then
              echo "Queue verification requires exact r2_key and all other operation modes disabled"; exit 1
            fi
            export PYTHONPATH=workers/source-library-staging/scripts
            python - <<'PY'
          import json, os, boto3
          from source_review_manifest_r2_v2 import load_staging_review_manifest
          client = boto3.client("s3", endpoint_url="https://" + os.environ["R2_ACCOUNT_ID"] + ".r2.cloudflarestorage.com",
                                aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                                aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"], region_name="auto")
          result = load_staging_review_manifest(client, owner_uid=os.environ["OWNER_UID"], r2_key=os.environ["R2_KEY"])
          print(json.dumps({"mode":"verify-published-queue", "verified_source_binding":True,
                            "pdf_pages":result["pdf_page_count"], "source_sha256":result["sha256"],
                            "approval_enabled":False, "indexed":False}, indent=2))
          PY
            exit 0
          fi
          if [[ "$PUBLISH_REVIEW_QUEUE" == "true" && "$REVIEW_QUEUE_DRY_RUN" == "true" ]]; then
            echo "Choose either publish_review_queue or review_queue_dry_run"; exit 1
          fi
          if [[ "$PUBLISH_REVIEW_QUEUE" == "true" ]]; then
            if [[ "$APPLY" == "true" || "$DISCOVER_ONLY" == "true" || "$FORCE_REINDEX" == "true" || -z "$R2_KEY" || -z "$DATABASE_URL" ]]; then
              echo "Publication requires exact r2_key, staging database lock secret, apply=false, discover_only=false, force_reindex=false"; exit 1
            fi
            export PYTHONPATH=workers/source-library-staging/scripts
            python - <<'PY'
          import json, os
          from process_r2_textbook import run
          result = run(os.environ["OWNER_UID"], os.environ["R2_KEY"], apply=False,
                       ocr=os.environ["OCR"] == "true", review_queue_mode="apply")
          print(json.dumps({"mode": "publish-review-queue",
                            "pdf_pages": result["pdf_pages"],
                            "passages": result["passages"],
                            "unresolved_pages": result["extraction_quality"]["unresolved_pdf_pages"],
                            "review_queue_publication": result["review_queue_publication"]}, indent=2))
          PY
            exit 0
          fi
          if [[ "$REVIEW_QUEUE_DRY_RUN" == "true" ]]; then
            if [[ "$APPLY" == "true" || "$DISCOVER_ONLY" == "true" || "$FORCE_REINDEX" == "true" || -z "$R2_KEY" ]]; then
              echo "Review queue dry run requires exact r2_key, apply=false, discover_only=false, force_reindex=false"; exit 1
            fi
            export PYTHONPATH=workers/source-library-staging/scripts
            python - <<'PY'
          import json, os
          from process_r2_textbook import run
          result = run(os.environ["OWNER_UID"], os.environ["R2_KEY"], apply=False,
                       ocr=os.environ["OCR"] == "true", review_queue_mode="dry-run")
          print(json.dumps({"mode": "review-queue-dry-run",
                            "pdf_pages": result["pdf_pages"],
                            "passages": result["passages"],
                            "unresolved_pages": result["extraction_quality"]["unresolved_pdf_pages"],
                            "review_queue_publication": result["review_queue_publication"]}, indent=2))
          PY
            exit 0
          fi
          args=(--owner-uid "$OWNER_UID" --limit "$LIMIT")
          if [[ "$DISCOVER_ONLY" == "true" ]]; then args+=(--discover-only); fi
          if [[ -n "$R2_KEY" ]]; then args+=(--r2-key "$R2_KEY"); fi
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          if [[ "$OCR" == "true" ]]; then args+=(--ocr); fi
          if [[ "$FORCE_REINDEX" == "true" ]]; then args+=(--force-reindex); fi
          python workers/source-library-staging/scripts/process_r2_backlog.py "${args[@]}"

name: Verify live reviewer routing on synthetic evidence
on:
  push:
    branches: [verify/mc-objective-heading-20261118]
permissions:
  contents: read
jobs:
  synthetic:
    if: github.run_attempt == '1' && contains(github.event.head_commit.message, '[verify-live-reviewer-rate-routing]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: source-library-staging
    steps:
      - uses: actions/checkout@v4
      - name: Send a signed synthetic evidence review
        env:
          STAGING_RECEIPT_SIGNING_SECRET: ${{ secrets.STAGING_RECEIPT_SIGNING_SECRET }}
        run: node scripts/verify-live-reviewer-routing.mjs

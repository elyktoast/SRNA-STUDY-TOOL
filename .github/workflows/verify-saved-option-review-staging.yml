name: Explicit saved MC option-review acceptance
on:
  push:
    branches: [verify/mc-saved-option-review-20261117]
permissions:
  contents: read
  checks: read
concurrency:
  group: source-reviewer-staging-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[complete-staging-option-review]')
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete only the missing saved MC review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          CONFIRM_PAID_OPTION_REVIEW: 'true'
          STAGING_SAVED_DRAFT_ID: 65c2e793-a7af-4746-bfb6-1abf9993085c
          STAGING_TARGET_SHA: 9c8089cb5eee12fbac12f492670bf1827b9a2efe
          STAGING_TARGET_IMAGE_SHA256: 6ab6d19131ab05bc64d6444c075ebd28940072a569f192e20b6a7fabffb44b16
        run: node scripts/verify-saved-staging-option-review.mjs

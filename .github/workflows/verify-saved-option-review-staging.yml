name: Explicit saved MC option-review acceptance
on:
  push:
    branches: [verify/mc-saved-option-review-20261117]
permissions:
  contents: read
  checks: read
concurrency:
  group: source-reviewer-staging-deployment
  cancel-in-progress: false
jobs:
  verify:
    if: github.run_attempt == '1' && contains(github.event.head_commit.message, '[complete-respiratory-option-review]')
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete only the missing saved MC review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          CONFIRM_PAID_OPTION_REVIEW: 'true'
          STAGING_SAVED_DRAFT_ID: f6440562-8a49-4293-8d67-d78e8773b811
          STAGING_TARGET_BUILD_UUID: 9bb497a7-b80a-4e5c-b9c3-fa7650a3b061
          STAGING_TARGET_SHA: f5a826025e4ede2edaa542e61820a5217456388f
          STAGING_TARGET_IMAGE_SHA256: 3e9a8a74f61c8a1ff9115ab69936f472a38224a32519530049d04fcc265e24b4
        run: node scripts/verify-saved-staging-option-review.mjs

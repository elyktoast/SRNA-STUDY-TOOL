name: Read saved MC adjudication
on:
  push:
    branches: [verify/mc-saved-option-review-20261117]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-saved-mc-review]')
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read existing judgments without model calls or writes
        env:
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: node scripts/inspect-saved-mc-adjudication.mjs

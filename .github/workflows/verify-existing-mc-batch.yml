name: Verify existing staging MC batch
on:
  push:
    branches: [verify/mc-objective-heading-20261118]
permissions:
  contents: read
  checks: read
concurrency:
  group: staging-mc-read-only-verification
  cancel-in-progress: false
jobs:
  batch:
    if: github.run_attempt == '1' && contains(github.event.head_commit.message, '[verify-existing-mc-batch-once]')
    runs-on: ubuntu-latest
    environment: source-library-staging
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read the authenticated queue status
        env:
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          STAGING_TEST_ADMIN_PASSWORD: ${{ secrets.STAGING_TEST_ADMIN_PASSWORD }}
          SRNA_STAGING_REVIEWER_ACCESS_TOKEN: ${{ secrets.STAGING_REVIEWER_ACCESS_TOKEN }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          node scripts/verify-authoring-contract-readonly.mjs
          node scripts/verify-existing-mc-batch.mjs

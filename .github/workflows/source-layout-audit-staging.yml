name: Read-only staging PDF layout comparison
on:
  push:
    branches: [fix/retrieval-back-matter-ranking, fix/multi-textbook-question-evidence]
    paths:
      - 'workers/source-library-staging/scripts/audit_pdf_reading_order_v2.py'
      - '.github/workflows/source-layout-audit-staging.yml'
permissions:
  contents: read
concurrency:
  group: source-layout-audit-staging
  cancel-in-progress: false
jobs:
  compare:
    if: contains(github.event.head_commit.message, '[audit-source-layout]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: source-library-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only source inspection dependencies
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'boto3>=1.35,<2' 'psycopg[binary]>=3.2,<4'
      - name: Verify multi-textbook ownership predicates in read-only PostgreSQL
        env:
          SRNA_RETRIEVAL_TEST_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PYTHONPATH: workers/source-library-staging/scripts
        run: python -m unittest discover -s workers/source-library-staging/scripts/tests -p test_multi_textbook_postgres_v2.py -v
      - name: Compare original pages across owned books without importing
        env:
          STAGING_ONLY: 'true'
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
          STAGING_R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          STAGING_R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
        run: >-
          python workers/source-library-staging/scripts/audit_pdf_reading_order_v2.py
          --owner-uid c003287a-10ce-4cc9-926e-ef7c3a162a26
          --all-owned

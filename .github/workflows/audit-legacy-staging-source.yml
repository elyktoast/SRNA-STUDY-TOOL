name: Audit legacy staging PDF passage provenance (one-time)
on:
  push:
    branches: [feature/source-library-r2-staging]
    paths: [.github/workflows/audit-legacy-staging-source.yml]
permissions:
  contents: read
concurrency:
  group: legacy-staging-pdf-audit
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/source-library-r2-staging'
    environment: source-library-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/source-library-r2-staging
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only verification dependencies
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'boto3>=1.35,<2' 'psycopg[binary]>=3.2,<4'
      - name: Compare independently re-extracted PDF against legacy passage index
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, tempfile
          from pathlib import Path
          import boto3, psycopg
          sys.path.insert(0, 'workers/source-library-staging/scripts')
          from process_r2_textbook import fetch_r2
          from extract_textbook import extract
          from import_extraction import read_jsonl, validate
          from source_legacy_passage_comparison_v2 import compare_indexed_passages
          from source_review_manifest_r2_v2 import load_staging_review_manifest
          owner='c003287a-10ce-4cc9-926e-ef7c3a162a26'
          key=owner+'/810040fc-da03-4fa5-bcc0-78c25957c325.pdf'
          book='2a589498-aaa4-410f-b51a-00d3ab99eafd'
          for name in ('DATABASE_URL','R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY'):
              if not os.environ.get(name):
                  raise SystemExit('Missing required staging-only secret: '+name)
          r2=boto3.client('s3',endpoint_url='https://'+os.environ['R2_ACCOUNT_ID']+'.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto')
          trusted=load_staging_review_manifest(r2,owner_uid=owner,r2_key=key)
          with tempfile.TemporaryDirectory() as directory:
              root=Path(directory)
              pdf=root/'source.pdf'
              downloaded=fetch_r2(pdf,owner,key,r2)
              if downloaded['sha256'] != trusted['sha256']:
                  raise SystemExit('R2 source differs from published attestation')
              extracted=root/'extracted'
              extract(pdf,extracted,owner,key,ocr=False)
              manifest=validate(extracted)
              if manifest['sha256'] != trusted['sha256']:
                  raise SystemExit('Extracted source digest mismatch')
              fresh=list(read_jsonl(extracted/'passages.jsonl'))
              with psycopg.connect(os.environ['DATABASE_URL'],autocommit=False) as conn:
                  conn.execute('SET TRANSACTION READ ONLY')
                  comparison=compare_indexed_passages(conn,textbook_id=book,owner_uid=owner,
                      fresh_passages=fresh,expected_page_count=trusted['pdf_page_count'],
                      expected_source_sha256=trusted['sha256'])
              safe={k:v for k,v in comparison.items() if k != 'source_sha256'}
              print('Staging read-only provenance comparison:',json.dumps(safe,sort_keys=True))
              if not comparison['same_ordered_passages_and_pages']:
                  raise SystemExit('Existing passages differ from fresh source; no backfill or writes performed')
              print('PASS: all indexed passages exactly match fresh extracted pages and text')
          PY

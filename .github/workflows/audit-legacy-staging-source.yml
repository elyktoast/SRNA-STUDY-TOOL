name: Audit legacy staging PDF passage provenance (OCR comparison)
on:
  push:
    branches: [feature/source-library-r2-staging]
    paths: [.github/workflows/audit-legacy-staging-source.yml]
  workflow_dispatch:
    inputs:
      register_verified_source:
        description: 'Leave blank for read-only audit. To insert only the verified source record, type REGISTER_VERIFIED_595_ONLY'
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: legacy-staging-pdf-audit
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feature/source-library-r2-staging'
    environment: source-library-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/source-library-r2-staging
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only verification dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'boto3>=1.35,<2' 'psycopg[binary]>=3.2,<4'
      - name: Compare independently re-extracted PDF against legacy passage index
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.STAGING_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.STAGING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.STAGING_R2_SECRET_ACCESS_KEY }}
          PROVENANCE_CONFIRMATION: ${{ github.event.inputs.register_verified_source || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, tempfile
          from pathlib import Path
          import boto3, psycopg
          sys.path.insert(0, 'workers/source-library-staging/scripts')
          from process_r2_textbook import fetch_r2
          from extract_textbook import extract
          from import_extraction import read_jsonl, validate
          from source_legacy_passage_comparison_v2 import compare_indexed_passages
          from source_review_manifest_r2_v2 import load_staging_review_manifest
          owner='c003287a-10ce-4cc9-926e-ef7c3a162a26'
          key=owner+'/810040fc-da03-4fa5-bcc0-78c25957c325.pdf'
          book='2a589498-aaa4-410f-b51a-00d3ab99eafd'
          for name in ('DATABASE_URL','R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY'):
              if not os.environ.get(name):
                  raise SystemExit('Missing required staging-only secret: '+name)
          r2=boto3.client('s3',endpoint_url='https://'+os.environ['R2_ACCOUNT_ID']+'.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],region_name='auto')
          trusted=load_staging_review_manifest(r2,owner_uid=owner,r2_key=key)
          with tempfile.TemporaryDirectory() as directory:
              root=Path(directory)
              pdf=root/'source.pdf'
              downloaded=fetch_r2(pdf,owner,key,r2)
              if downloaded['sha256'] != trusted['sha256']:
                  raise SystemExit('R2 source differs from published attestation')
              extracted=root/'extracted'
              extract(pdf,extracted,owner,key,ocr=False)
              manifest=validate(extracted)
              if manifest['sha256'] != trusted['sha256']:
                  raise SystemExit('Extracted source digest mismatch')
              fresh=list(read_jsonl(extracted/'passages.jsonl'))
              with psycopg.connect(os.environ['DATABASE_URL'],autocommit=False) as conn:
                  conn.execute('SET TRANSACTION READ ONLY')
                  comparison=compare_indexed_passages(conn,textbook_id=book,owner_uid=owner,
                      fresh_passages=fresh,expected_page_count=trusted['pdf_page_count'],
                      expected_source_sha256=trusted['sha256'])
              safe={k:v for k,v in comparison.items() if k != 'source_sha256'}
              print('Staging read-only provenance comparison:',json.dumps(safe,sort_keys=True))
              if comparison['same_ordered_passages_and_pages']:
                  print('PASS: original text-only extraction exactly matches indexed text')
              else:
                  print('Text-only extraction differs; comparing OCR-enabled extraction read-only')
                  ocr_dir=root/'ocr-extracted'
                  extract(pdf,ocr_dir,owner,key,ocr=True)
                  ocr_manifest=validate(ocr_dir)
                  if ocr_manifest['sha256'] != trusted['sha256']:
                      raise SystemExit('OCR-extracted source digest mismatch')
                  ocr_passages=list(read_jsonl(ocr_dir/'passages.jsonl'))
                  with psycopg.connect(os.environ['DATABASE_URL'],autocommit=False) as conn:
                      conn.execute('SET TRANSACTION READ ONLY')
                      ocr_comparison=compare_indexed_passages(
                          conn,textbook_id=book,owner_uid=owner,
                          fresh_passages=ocr_passages,expected_page_count=trusted['pdf_page_count'],
                          expected_source_sha256=trusted['sha256'])
                  safe_ocr={k:v for k,v in ocr_comparison.items() if k != 'source_sha256'}
                  print('Staging OCR-enabled comparison:',json.dumps(safe_ocr,sort_keys=True))
                  print('OCR pages recovered:',len(ocr_manifest.get('ocr_pages',[])))
                  if not ocr_comparison['same_ordered_passages_and_pages']:
                      raise SystemExit('Both extraction modes differ from legacy index; no DB writes performed')
                  print('PASS: OCR-enabled extraction exactly matches existing index')
              from source_retrieval_acceptance_v2 import verify_retrieval_against_extraction
              with psycopg.connect(os.environ['DATABASE_URL'],autocommit=False) as conn:
                  conn.execute('SET TRANSACTION READ ONLY')
                  retrieval = verify_retrieval_against_extraction(
                      conn,owner_uid=owner,textbook_id=book,fresh_passages=ocr_passages)
              print('Staging retrieval acceptance:',json.dumps(retrieval,sort_keys=True))
              confirmation=os.environ.get('PROVENANCE_CONFIRMATION','')
              if confirmation and confirmation != 'REGISTER_VERIFIED_595_ONLY':
                  raise SystemExit('Invalid provenance registration confirmation; no write')
              if confirmation == 'REGISTER_VERIFIED_595_ONLY':
                  if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch':
                      raise SystemExit('Provenance registration must be manually dispatched')
                  if not ocr_comparison['same_ordered_passages_and_pages']:
                      raise SystemExit('No registration without exact OCR match')
                  from register_verified_legacy_source_v2 import register_verified_legacy_source
                  with psycopg.connect(os.environ['DATABASE_URL'],autocommit=False) as conn:
                      registered=register_verified_legacy_source(
                          conn,owner_uid=owner,textbook_id=book,r2_key=key,
                          source_sha256=trusted['sha256'],source_size_bytes=pdf.stat().st_size,
                          pdf_page_count=trusted['pdf_page_count'],fresh_passages=ocr_passages,
                          verified_r2_attestation=True,extraction_ocr_enabled=True,
                          explicit_operator_approval=True)
                  print('Staging provenance registration:',
                        json.dumps(registered,sort_keys=True))
              else:
                  print('Read-only audit completed; no provenance record written')
          PY

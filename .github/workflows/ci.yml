name: Quality gates

on:
  workflow_dispatch:

concurrency:
  group: snar-quality-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Validate architecture and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate repository architecture
        shell: bash
        run: |
          set +e
          npm run validate 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          {
            echo '### Repository validation'
            echo '```text'
            cat validation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Validate question content integrity
        run: npm run test:content
      - name: Run semantic content audit
        run: npm run test:semantic
      - name: Enforce performance and architecture budgets
        run: npm run test:perf
      - name: Analyze question-bank balance
        run: npm run analyze:questions
      - name: Verify content review queue
        run: npm run test:review-queue
      - name: Simulate precalibration CAT behavior
        run: npm run test:cat
      - name: Verify account-aware question coverage
        run: npm run test:coverage
      - name: Build clean question JSON export
        run: node scripts/export-question-data.mjs
      - name: Upload clean question JSON export
        uses: actions/upload-artifact@v4
        with:
          name: srna-question-data-no-difficulty
          path: exports/srna-question-data-no-difficulty.json
          retention-days: 30

  browser:
    name: Browser regression (${{ matrix.shard }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7


name: Study Studio acronym readability tests
on:
  push:
    branches: [fix/studio-uncommon-acronym-clarity]
  pull_request:
    paths:
      - 'equipment/assets/acronym-clarity.js'
      - 'equipment/assets/studio-loader.js'
      - 'equipment/assets/studio-runtime.js'
      - 'scripts/test-studio-acronym-clarity.mjs'
      - 'scripts/test-studio-matching-choices.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared quiz acronym rendering
        run: |
          node --check equipment/assets/acronym-clarity.js
          node --check equipment/assets/studio-runtime.js
          node --check equipment/assets/studio-loader.js
          node scripts/test-studio-acronym-clarity.mjs
          node scripts/test-studio-matching-choices.mjs
          node scripts/audit-exam2-respiratory-monitoring.mjs --baseline-check
          node scripts/test-exam2-reviewed-report-fixes.mjs

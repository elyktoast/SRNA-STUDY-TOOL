<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Source Library · SRNA Study Tool</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark}
body{margin:0;background:#101827;color:#edf2fa}
main{max-width:760px;margin:8vh auto;padding:24px}
section{background:#1d293a;border:1px solid #42516a;border-radius:16px;padding:24px}
h1{margin:0 0 8px}p{line-height:1.5;color:#c6d2e2}
form{display:grid;gap:18px}label{display:grid;gap:10px}
input{width:100%;max-width:100%}
.source-upload-actions{display:flex;gap:12px}
button{padding:12px 20px;border-radius:9px;border:1px solid #8196b2;background:#314b70;color:white;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
progress{width:100%;height:16px}
a{color:#9cc5ff}
</style>
</head>
<body>
<main>
<h1>Private Source Library</h1>
<p>Administrator-only textbook uploads. Your PDFs are stored in private Cloudflare R2 storage.</p>
<div id="source-gate" role="status">Checking administrator access…</div>
<div id="source-upload-root"></div>
<p><a href="./">Back to Study Center</a></p>
</main>
<script>window.MBU_BOOT={styles:['site-nav.css'],scripts:[{src:'site-nav.js',data:{page:'home'}},'auto-update.js']};</script>
<script src="equipment/assets/build-bootstrap.js"></script>
<script type="module">
import {mountSourceUpload} from './scripts/ai-source-admin-upload-ui.mjs';
const gate=document.getElementById('source-gate');
try{
 if(window.MBUPageReady&&typeof window.MBUPageReady.then==='function')await window.MBUPageReady;
 const auth=window.MBUSupabase;
 if(!auth?.accessToken||!auth?.adminStatus)throw Error('Sign in before opening the Source Library.');
 const admin=await auth.adminStatus();
 if(admin?.is_admin!==true)throw Error('Administrator access required.');
 const apiBaseUrl=window.SRNA_SOURCE_API_URL||'';
 mountSourceUpload({root:document.getElementById('source-upload-root'),
  getAccessToken:()=>auth.accessToken(),apiBaseUrl});
 gate.textContent='Administrator access confirmed.';
}catch(error){gate.textContent=error?.message||'Source Library unavailable.';}
</script>
</body>
</html>

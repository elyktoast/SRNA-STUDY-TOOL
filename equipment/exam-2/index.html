<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipment Exam 2 | SRNA Study Tool</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark}body{max-width:880px;margin:0 auto;padding:24px;line-height:1.5}button,select{font:inherit;padding:10px;border-radius:8px}button{cursor:pointer}.muted{opacity:.75}.option{display:block;padding:12px;margin:8px 0;border:1px solid #8887;border-radius:8px}.option:has(input:checked){border-color:#3182ce;background:#3182ce19}.question{padding:18px;border:1px solid #8887;border-radius:12px}img{max-width:100%;height:auto}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}.answer{padding:12px;border-left:4px solid #3182ce;margin:16px 0}.error{color:#b91c1c}
</style></head><body>
<nav><a href="../">← Equipment</a></nav><h1>Equipment — Exam 2</h1><p class="muted">500 board-style questions. Questions are shuffled per session; answers and explanations appear after submission.</p>
<div class="toolbar"><label>Questions <select id="length"><option value="50">50</option><option value="100">100</option><option value="500">All 500</option></select></label><button id="start">Start practice</button><span id="progress"></span></div>
<main id="content" aria-live="polite">Loading question bank…</main>
<script>
let bank=[],images={},session=[],position=0,correct=0,submitted=false;
const el=id=>document.getElementById(id);
const shuffle=items=>{const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(){session=shuffle(bank).slice(0,Number(el('length').value));position=0;correct=0;render()}
function render(){submitted=false;if(position>=session.length){el('progress').textContent='Completed';el('content').innerHTML='<h2>Session complete</h2><p>Score: '+correct+' / '+session.length+'</p><button id="again">New session</button>';el('again').onclick=start;return}
const q=session[position];el('progress').textContent=(position+1)+' / '+session.length;
const src=q.img&&images[q.img]? 'data:'+images[q.img].mime+';base64,'+images[q.img].data:null;
el('content').innerHTML='<section class="question"><p class="muted">'+safe(q.lecture)+' · '+safe(q.difficulty)+'</p><h2>'+safe(q.q)+'</h2>'+(src?'<img alt="'+safe(images[q.img].caption||'Question diagram')+'" src="'+src+'">':'')+'<form id="answers">'+q.c.map((c,i)=>'<label class="option"><input type="'+(q.select>1?'checkbox':'radio')+'" name="answer" value="'+i+'"> '+safe(c)+'</label>').join('')+'<button type="submit">Check answer</button></form><div id="feedback"></div></section>';
el('answers').onsubmit=e=>{e.preventDefault();if(submitted)return;const selected=[...document.querySelectorAll('input[name=answer]:checked')].map(i=>Number(i.value)).sort((a,b)=>a-b);if(selected.length!==q.select){el('feedback').textContent='Select '+q.select+' answer'+(q.select===1?'':'s')+'.';return}submitted=true;const expected=[...q.a].sort((a,b)=>a-b);const ok=JSON.stringify(selected)===JSON.stringify(expected);if(ok)correct++;el('answers').querySelectorAll('input,button').forEach(x=>x.disabled=true);el('feedback').innerHTML='<div class="answer"><strong>'+(ok?'Correct':'Incorrect')+'</strong><p>Correct answer: '+expected.map(i=>safe(q.c[i])).join('; ')+'</p><p>'+safe(q.exp)+'</p></div><button id="next">'+(position+1===session.length?'See results':'Next question')+'</button>';el('next').onclick=()=>{position++;render()}}}
Promise.all([fetch('./questions.json').then(r=>{if(!r.ok)throw Error('Question bank not yet installed');return r.json()}),fetch('./images.json').then(r=>{if(!r.ok)throw Error('Image bank not yet installed');return r.json()})]).then(([q,im])=>{bank=q.questions;images=im.images;el('content').textContent=bank.length+' questions ready. Choose a session length and start.';el('start').onclick=start}).catch(e=>{el('content').innerHTML='<p class="error">'+safe(e.message)+'. Upload questions.json and images.json to equipment/exam-2/ before using this exam.</p>'});
</script></body></html>
